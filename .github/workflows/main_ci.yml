name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.run_id }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  lint:
    name: check format
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install zig
        uses: mlugg/setup-zig@v2

      - name: check format
        run: zig fmt --check .

  test:
    name: test | ${{ matrix.platform.target }}-${{ matrix.optimize }}
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseFast]
        platform:
          #Windows
          - os: windows-latest
            target: x86_64-windows-gnu
          - os: windows-latest
            target: x86-windows-gnu
          - os: windows-latest
            target: x86_64-windows-msvc
          - os: windows-latest
            target: x86-windows-msvc
          - os: windows-11-arm
            target: aarch64-windows-gnu
          - os: windows-11-arm
            target: aarch64-windows-msvc

          # Linux
          - os: ubuntu-latest
            target: x86_64-linux-gnu
          - os: ubuntu-latest
            target: x86_64-linux-musl
          - os: ubuntu-latest
            target: x86-linux-gnu
          - os: ubuntu-latest
            target: x86-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-linux-musl

          # macOS
          - os: macos-latest
            target: aarch64-macos

    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install zig
        uses: mlugg/setup-zig@v2
        with:
          # One cache per matrix entry, started fresh when build.zig.zon changes. If one ever goes
          # stale, `gh cache delete --all` clears them. Releases build without it.
          cache-key: ${{ matrix.platform.target }}-${{ matrix.optimize }}-${{ hashFiles('build.zig.zon') }}
          cache-size-limit: 350

      # The agree tests load a Rust library built with cargo, which the runners have. 32-bit Windows needs its target
      - name: add 32-bit Rust
        if: startsWith(matrix.platform.target, 'x86-windows')
        run: rustup target add i686-pc-windows-msvc

      - name: run tests
        run: zig build test -Doptimize=${{ matrix.optimize }} -Dtarget=${{ matrix.platform.target }} --test-timeout 3m --summary all
